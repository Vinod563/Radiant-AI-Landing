<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Preview — Maturity Staircase</title>
<style>
  body { background: #05111F; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Inter:wght@400;500;600&display=swap');
</style>
</head>
<body>
<div style="width:560px;background:#010F1E;border-radius:20px;padding:36px 40px;border:1px solid rgba(255,255,255,0.07);">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;">
    <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#91C46B;font-family:'Inter',sans-serif;">Where You Are in the Journey</span>
    <span style="font-size:13px;font-weight:700;color:#91C46B;font-family:'Inter',sans-serif;">Stage 3 of 5</span>
  </div>
  <div style="display:flex;align-items:flex-end;gap:10px;height:220px;">
    <!-- Stage 1 Assess — past -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">
      <div style="width:100%;border-radius:6px 6px 0 0;background:rgba(145,196,107,0.08);border:1px solid rgba(145,196,107,0.2);border-bottom:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;height:44%;">
        <div style="font-size:22px;font-weight:900;color:rgba(145,196,107,0.6);font-family:'Poppins',sans-serif;">1</div>
        <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.3);font-family:'Poppins',sans-serif;">Assess</div>
      </div>
      <p style="margin-top:8px;font-size:9px;color:rgba(255,255,255,0.2);text-align:center;">No strategy yet</p>
    </div>
    <!-- Stage 2 Train — past -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">
      <div style="width:100%;border-radius:6px 6px 0 0;background:rgba(145,196,107,0.08);border:1px solid rgba(145,196,107,0.2);border-bottom:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;height:58%;">
        <div style="font-size:22px;font-weight:900;color:rgba(145,196,107,0.6);font-family:'Poppins',sans-serif;">2</div>
        <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.3);font-family:'Poppins',sans-serif;">Train</div>
      </div>
      <p style="margin-top:8px;font-size:9px;color:rgba(255,255,255,0.2);text-align:center;">Pilots &amp; literacy gaps</p>
    </div>
    <!-- Stage 3 Adopt — CURRENT -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">
      <div style="margin-bottom:10px;text-align:center;">
        <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#91C46B;margin-bottom:5px;">You are here</div>
        <div style="width:0;height:0;margin:0 auto;border-left:5px solid transparent;border-right:5px solid transparent;border-top:5px solid #91C46B;"></div>
      </div>
      <div style="width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,rgba(145,196,107,0.28) 0%,rgba(145,196,107,0.14) 100%);border:1px solid rgba(145,196,107,0.5);border-bottom:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;height:72%;">
        <div style="font-size:22px;font-weight:900;color:#91C46B;font-family:'Poppins',sans-serif;">3</div>
        <div style="font-size:11px;font-weight:700;color:#fff;font-family:'Poppins',sans-serif;">Adopt</div>
      </div>
      <p style="margin-top:8px;font-size:9px;color:rgba(255,255,255,0.5);text-align:center;">AI live, not scaled</p>
    </div>
    <!-- Stage 4 Govern — future -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">
      <div style="width:100%;border-radius:6px 6px 0 0;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-bottom:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;height:86%;">
        <div style="font-size:22px;font-weight:900;color:rgba(255,255,255,0.2);font-family:'Poppins',sans-serif;">4</div>
        <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.18);font-family:'Poppins',sans-serif;">Govern</div>
      </div>
      <p style="margin-top:8px;font-size:9px;color:rgba(255,255,255,0.18);text-align:center;">Broadly deployed</p>
    </div>
    <!-- Stage 5 Scale — future -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">
      <div style="width:100%;border-radius:6px 6px 0 0;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-bottom:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;height:100%;">
        <div style="font-size:22px;font-weight:900;color:rgba(255,255,255,0.2);font-family:'Poppins',sans-serif;">5</div>
        <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.18);font-family:'Poppins',sans-serif;">Scale</div>
      </div>
      <p style="margin-top:8px;font-size:9px;color:rgba(255,255,255,0.18);text-align:center;">AI-first advantage</p>
    </div>
  </div>
  <!-- Progress dots -->
  <div style="display:flex;justify-content:center;gap:6px;margin-top:22px;">
    <div style="width:20px;height:6px;background:rgba(145,196,107,0.5);border-radius:100px;"></div>
    <div style="width:20px;height:6px;background:rgba(145,196,107,0.5);border-radius:100px;"></div>
    <div style="width:20px;height:6px;background:#91C46B;border-radius:100px;"></div>
    <div style="width:6px;height:6px;background:rgba(255,255,255,0.12);border-radius:100px;"></div>
    <div style="width:6px;height:6px;background:rgba(255,255,255,0.12);border-radius:100px;"></div>
  </div>
  <p style="font-size:12px;color:rgba(255,255,255,0.35);text-align:center;margin-top:18px;line-height:1.5;">Most organizations take 12–18 months to move from Stage 3 to Stage 4.</p>
</div>
</body>
</html>
